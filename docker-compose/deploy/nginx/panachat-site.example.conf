# Example HTTPS site for Panachat (place under /etc/nginx/sites-available/).
# TLS paths are placeholders — use certbot or your own certs.
#
# Upstream file (auto-loaded from conf.d on most distros):
#   cp docker-compose/deploy/nginx/panachat-upstream.blue.conf \
#      /etc/nginx/conf.d/panachat-upstream.conf
#   # panachat-deploy-remote.sh rewrites that file on each flip

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    # ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    location / {
        proxy_pass http://panachat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed SPA assets — safe to cache; never rewrite paths. A 404 from the live
    # slot falls back to @spa_asset_archive below.
    location /_spa/assets/ {
        proxy_pass http://panachat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_intercept_errors on;
        error_page 404 = @spa_asset_archive;
    }

    location /_spa-auth/assets/ {
        proxy_pass http://panachat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_intercept_errors on;
        error_page 404 = @spa_asset_archive;
    }

    location /_spa-workbench/assets/ {
        proxy_pass http://panachat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_intercept_errors on;
        error_page 404 = @spa_asset_archive;
    }

    # Chunks of earlier builds, kept by scripts/panachat-deploy-remote.sh
    # (archive_slot_assets). Served only when the live slot answers 404, so a tab
    # opened before a deploy keeps loading its own build instead of reloading
    # mid-send (T-031).
    location @spa_asset_archive {
        root /var/lib/panachat/spa-asset-archive;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

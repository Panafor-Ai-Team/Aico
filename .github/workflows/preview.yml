name: PR Preview

# Ephemeral preview for PRs into canary, running entirely on the PR's GitHub
# Actions runner — never on the production host:
#   - builds the app image, boots the full stack (app, ParadeDB, Redis, RustFS,
#     SearXNG) on throwaway /tmp env files and fresh named volumes,
#   - exposes the app and object storage through Cloudflare quick tunnels so
#     the URL works from outside the runner,
#   - upserts one PR comment with the URL, then holds the job open (max 6 h).
# A push cancels the previous run through the concurrency group; closing the PR
# cancels it too. Nothing survives the run.
#
# Chat runs on a single shared CVC inference key (no per-user key minting, no
# control plane). The secret PREVIEW_CVC_INFERENCE_KEY must be a CVC sub-key
# with a small balance; use a key separate from production: PR workflows execute
# the PR's code, so any secret here is readable by that code. Missing → managed
# chat refuses traffic (BYOK still works), everything else still previews.

on:
  pull_request:
    branches: [canary]
    types: [opened, synchronize, reopened, closed]

# A new push (or the close event) cancels the previous preview. The close run
# exists only to kill the sleeping job; its own job is skipped.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  COMPOSE_DIR: docker-compose/deploy
  APP_ENV_FILE: /tmp/preview-app.env
  INFRA_ENV_FILE: /tmp/preview-infra.env
  # The single account that owns the preview wallet. Override the password with
  # a repository secret when the repo is public.
  PREVIEW_EMAIL: preview@panafor.com
  PREVIEW_PASSWORD: ${{ secrets.PREVIEW_ACCOUNT_PASSWORD || 'Preview-2026!' }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: panachat:preview
          # Measured on this PR: 374 s without cache-to, 743 s cold + 819 s warm
          # with `mode=max`. Exporting the whole cache costs more than it saves,
          # because the PR sha changes the source layer on every run.
          platforms: linux/amd64

      - name: Reclaim build cache
        run: docker buildx prune -af

      - name: Start Cloudflare quick tunnels
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/cloudflared"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$BIN"
          chmod +x "$BIN"
          "$BIN" tunnel --no-autoupdate --url http://127.0.0.1:3210 >/tmp/app-tunnel.log 2>&1 &
          "$BIN" tunnel --no-autoupdate --url http://127.0.0.1:9000 >/tmp/s3-tunnel.log 2>&1 &
          APP_URL='' S3_URL=''
          for _ in $(seq 1 60); do
            APP_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/app-tunnel.log | head -1 || true)
            S3_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/s3-tunnel.log | head -1 || true)
            if [ -n "$APP_URL" ] && [ -n "$S3_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$APP_URL" ] || [ -z "$S3_URL" ]; then
            echo "::error::Cloudflare quick tunnels did not come up"
            tail -n 50 /tmp/app-tunnel.log /tmp/s3-tunnel.log || true
            exit 1
          fi
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "S3_URL=$S3_URL" >> "$GITHUB_ENV"
          echo "Preview: $APP_URL (storage $S3_URL)"

      - name: Write throwaway environment
        env:
          CVC_KEY: ${{ secrets.PREVIEW_CVC_INFERENCE_KEY }}
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          RUSTFS_ACCESS_KEY="preview$(openssl rand -hex 8)"
          RUSTFS_SECRET_KEY=$(openssl rand -hex 24)

          cat > "$INFRA_ENV_FILE" <<EOF
          PANACHAT_STACK=panachat-preview
          PANACHAT_VOLUME_PREFIX=panachat_preview
          PANACHAT_IMAGE=panachat:preview
          PANACHAT_PORT_BLUE=3210
          PANACHAT_PORT_GREEN=3211
          PANACHAT_DB_NAME=lobechat
          LOBE_DB_NAME=lobechat
          POSTGRES_CONTAINER=panachat-preview-postgres
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          RUSTFS_PORT=9000
          RUSTFS_ACCESS_KEY=$RUSTFS_ACCESS_KEY
          RUSTFS_SECRET_KEY=$RUSTFS_SECRET_KEY
          RUSTFS_LOBE_BUCKET=lobe
          S3_ENDPOINT=$S3_URL
          PANACHAT_APP_ENV_FILE=$APP_ENV_FILE
          PANACHAT_INFRA_ENV_FILE=$INFRA_ENV_FILE
          EOF

          # Same app knobs as the local preview (scripts/preview/app-env.sh), so
          # the two paths cannot drift.
          OUT="$APP_ENV_FILE" APP_URL="$APP_URL" S3_URL="$S3_URL" \
            S3_INTERNAL_ENDPOINT=http://rustfs:9000 CVC_KEY="$CVC_KEY" \
            bash scripts/preview/app-env.sh

      - name: Boot the stack
        run: |
          set -euo pipefail
          cd "$COMPOSE_DIR"
          # `--pull missing` overrides the app's `pull_policy: always` (the image
          # was built locally) while still fetching Postgres/Redis/RustFS/SearXNG.
          docker compose -p panachat-preview \
            --env-file "$INFRA_ENV_FILE" --env-file "$APP_ENV_FILE" \
            -f docker-compose.panachat.yml \
            --profile slot-blue \
            up -d --pull missing

      - name: Wait for the app
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3210/signin || true)
            case "$code" in
              200|302|307) echo "app is up ($code)"; exit 0 ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' panachat-preview-blue 2>/dev/null || true)" != true ]; then
              echo "::error::app container exited"
              docker logs panachat-preview-blue 2>&1 | tail -n 100 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::app did not become healthy in 10 minutes"
          docker logs panachat-preview-blue 2>&1 | tail -n 100 || true
          exit 1

      - name: Seed the preview account and its wallet
        env:
          CVC_KEY: ${{ secrets.PREVIEW_CVC_INFERENCE_KEY }}
        run: |
          set -euo pipefail
          compose() {
            docker compose -p panachat-preview \
              --env-file "$INFRA_ENV_FILE" --env-file "$APP_ENV_FILE" \
              -f docker-compose.panachat.yml "$@"
          }
          cd "$COMPOSE_DIR"

          # Enforce mode refuses traffic until a snapshot marks the ledger
          # authoritative. A throwaway database needs none of the reconciliation
          # a real cutover does, so flip the flag it waits on.
          compose exec -T postgresql psql -U postgres -d lobechat -q -c "
            update aico_ledger_state set snapshot_completed_at = now()
            where id = 'default' and snapshot_completed_at is null;
          "

          # One account owns the only wallet: reviewers sign in with it instead
          # of creating a user per run. AUTH_ALLOWED_EMAILS rejects every other
          # email (this sign-up call is the only one that can succeed), so no one
          # else can register and spend the shared key.
          curl -fsS -X POST http://127.0.0.1:3210/api/auth/sign-up/email \
            -H 'content-type: application/json' -H "Origin: $APP_URL" \
            -d "{\"email\":\"$PREVIEW_EMAIL\",\"password\":\"$PREVIEW_PASSWORD\",\"name\":\"Preview\"}" \
            >/dev/null 2>&1 || true   # 422 when the account already exists

          # The wallet is not a per-run allowance: it starts at the shared key's
          # real remaining balance and only goes down, so topping the key up is
          # the only way to refill it. 25,000,000 tokens = 1 USD = 1,000,000 µUSD.
          TOKENS=$(curl -fsS https://ru.cheapvibecode.ru/v1/balance \
            -H "Authorization: Bearer ${CVC_KEY:-}" |
            python3 -c 'import sys,json;print(json.load(sys.stdin)["token_balance"])' 2>/dev/null || echo 0)
          MICRO=$(( TOKENS / 25 ))

          compose exec -T postgresql psql -U postgres -d lobechat -q -c "
            insert into user_wallets (id, user_id, balance_micro_usd, raw_capacity_micro_usd)
            select 'wlt_preview_shared', id, $MICRO, $MICRO
            from users where email = '$PREVIEW_EMAIL'
            on conflict (user_id) do update
              set balance_micro_usd = excluded.balance_micro_usd,
                  raw_capacity_micro_usd = excluded.raw_capacity_micro_usd;
          "
          echo "preview wallet: $TOKENS tokens = $MICRO µUSD for $PREVIEW_EMAIL"
          echo "WALLET_MICRO_USD=$MICRO" >> "$GITHUB_ENV"

      - name: Comment the preview URL
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Preview: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          cat > /tmp/preview-comment.md <<EOF
          <!-- panachat-preview -->
          ## Preview ready — SHA ${{ github.event.pull_request.head.sha }}

          **$APP_URL**

          - Sign in as \`$PREVIEW_EMAIL\` / \`$PREVIEW_PASSWORD\`. Sign-up is closed: every other email is rejected.
          - Wallet: \`$WALLET_MICRO_USD\` µUSD (1,000,000 µUSD = 1 USD), read from the shared CVC key at boot. It is not renewed per run and only goes down; when the key is empty, chat stops until it is topped up.
          - Fresh database, Redis, and object storage on the runner. Nothing from production, and nothing survives the run.
          - No production server, DNS record, or deploy workflow is involved. The URL dies on the next push (a new preview replaces it) or after ~6 hours.
          - Expired? \`gh run rerun <run-id>\` boots it again from the cached image, without rebuilding from scratch.
          EOF

          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- panachat-preview -->")) | .id' | head -1 || true)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@/tmp/preview-comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/preview-comment.md
          fi

      - name: Serve preview
        run: |
          # Hold the job (and both tunnels) open. A push or PR close cancels this
          # run; 5 h also stays under the 350-minute job timeout.
          sleep 18000

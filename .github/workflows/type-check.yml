name: Type Check

# The only quality gate that runs on PRs in this fork: every upstream CI
# workflow (test.yml, pr-build-*.yml) is workflow_dispatch-only here, which is
# how the root type-check drifted to 201 errors across 76 files unnoticed.
# Keep this green — a new type error must fail the PR, not accumulate.
on:
  pull_request:
    branches:
      - canary
      - main
  push:
    branches:
      - canary
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        # This repo is deliberately lockfile-free: `pnpm-lock.yaml` is gitignored
        # and `pnpm-workspace.yaml` sets `lockfile: false`. There is nothing to
        # freeze against, so `--frozen-lockfile` only ever compares the config
        # against a stale lockfile restored from the runner cache and fails with
        # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # ffmpeg-static's install script downloads its binary from GitHub releases and
          # fails the whole install on any 5xx (seen: 504s for over an hour on 2026-11-08).
          # Nothing in this job runs ffmpeg (only generation/video does, at runtime), so
          # point it at an existing file: the script then exits with "installed already".
          FFMPEG_BIN: /usr/bin/true

      - name: Type check
        run: pnpm type-check
        env:
          NODE_OPTIONS: --max-old-space-size=8192

name: Database Schema Visualization CI
permissions:
  contents: read

# Aico: not used (upstream docs schema viz on main).
# Restore upstream `on:` when re-enabling. Manual run still possible.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install deps
        run: pnpm install

      - name: sync database schema to dbdocs
        env:
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
        run: bun run db:visualize

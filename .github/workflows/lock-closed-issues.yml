name: 'Lock Stale Issues'

# Aico: not used (upstream LobeHub issue hygiene).
# Restore upstream `on:` when re-enabling. Manual run still possible.
on:
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: lock-threads

jobs:
  lock-closed-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lock closed issues after 7 days of inactivity
        uses: actions/github-script@v8
        with:
          script: |
            const lockScript = require('./.github/scripts/lock-closed-issues.js');
            await lockScript({ github, context });
